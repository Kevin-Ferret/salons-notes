<style>
/* VOICE: quick, practical, one-handed in a crowded hall; big targets, no fuss.
   IDEA: the salon's printed catalogue and aisle signs — each aisle a band with its big letter.
   PICTURE: the route itself: aisle letters as large markers beside the stands to visit.
   COLOUR and TYPE: wine red dominant on white, blush support, gold for stars; Fraunces titles, Figtree text.
   LAYOUT: sticky bar with four tabs, one column up to 760px, cards stacked. */
:root{color-scheme:light dark;--bg:light-dark(#fff,#140a0e);--ink:light-dark(#1d1015,#f3e9ec);--mut:light-dark(#6b5a60,#b9a6ac);--wine:light-dark(#6d1230,#d0587c);--wine2:light-dark(#8e1d41,#e07a98);--soft:light-dark(#f8eef1,#22131a);--line:light-dark(#ecdbe1,#3a2129);--gold:#d39a00;--on:light-dark(#fff,#140a0e);--head:light-dark(#6d1230,#4d0d23)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:5;background:var(--head);color:#fff}
.bar{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;max-width:760px;margin:auto;padding:12px 16px 4px}
h1{font:600 22px/1.1 Fraunces,Georgia,serif;margin:0}
h1 span{font:400 14px Figtree,sans-serif;opacity:.8;margin-left:6px}
#sync{margin-left:auto;font-size:13px;opacity:.85}
nav{display:flex;max-width:760px;margin:auto;padding:0 8px}
nav a{flex:1;text-align:center;color:#fff;text-decoration:none;padding:10px 4px 12px;font-weight:600;border-bottom:3px solid transparent;opacity:.8;min-height:44px}
nav a.on{opacity:1;border-color:var(--gold)}
nav b{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:#1d1015;font-size:13px;margin-left:4px}
nav b:empty{display:none}
main{max-width:760px;margin:auto;padding:16px 16px 96px}
h2{font:600 28px/1.1 Fraunces,Georgia,serif;margin:4px 0 6px;text-wrap:balance}
.sub{color:var(--mut);margin:0 0 14px}
.tools{display:grid;gap:8px;grid-template-columns:minmax(0,1fr) auto;margin-bottom:10px}
input[type=search],input[type=text],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
textarea{min-height:80px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:20px;padding:8px 14px;min-height:40px;font-weight:600;font-size:15px}
.chip[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--on)}
.card{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--bg)}
.card.sl{border-color:var(--wine2);background:var(--soft)}
.nm{background:none;border:0;padding:0;font-weight:700;font-size:17px;text-align:left}
.meta{color:var(--mut);font-size:14px}
.hist{font-size:14px;margin-top:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;background:var(--soft);color:var(--wine);margin:4px 4px 0 0;border:1px solid var(--line)}
.tag.must{background:var(--wine);color:var(--on);border-color:var(--wine)}
.seg{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.seg button{flex:1;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.seg button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:var(--on)}
.two{display:grid;grid-template-columns:7em minmax(0,1fr);gap:8px;margin-top:8px}
.aisle{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;margin-bottom:14px}
.al{font:600 44px/1 Fraunces,Georgia,serif;color:var(--wine);text-align:center;position:sticky;top:130px;align-self:start;padding-top:6px}
.rc{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:start}
.std{font:700 20px/1.2 Figtree,sans-serif;color:var(--wine);white-space:nowrap;min-width:3.2em}
.stars{display:flex;gap:4px;margin-top:8px;grid-column:1/-1}
.stars button{flex:1;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:24px;line-height:1;color:var(--line)}
.stars button.f{color:var(--gold);border-color:var(--gold);background:light-dark(#fff8e6,#2a2008)}
.buy{grid-column:1/-1;min-height:44px;border:1px dashed var(--wine2);border-radius:10px;background:none;font-weight:700;color:var(--wine);margin-top:6px}
.buy[aria-pressed=true]{background:var(--wine);color:var(--on);border-style:solid}
.done .std,.done .nm,.done .meta,.done .tag{opacity:.55}
.prog{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.meter{flex:1 1 160px;height:10px;border-radius:5px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--wine)}
.fab{position:fixed;right:16px;bottom:18px;z-index:6;background:var(--head);color:#fff;border:0;border-radius:28px;padding:14px 20px;font-weight:700;box-shadow:0 6px 18px #0004;min-height:52px}
.btn{min-height:44px;padding:10px 16px;border-radius:10px;border:1px solid var(--wine);background:var(--wine);color:var(--on);font-weight:700}
.btn.ghost{background:none;color:var(--wine)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}
.empty{padding:28px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:14px}
#sheet{position:fixed;inset:0;z-index:10;background:#0007;display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 28px}
.panel h3{font:600 24px/1.15 Fraunces,Georgia,serif;margin:0 0 4px}
.visit{border-top:1px solid var(--line);padding:10px 0}
.visit b{color:var(--wine)}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:6px}
td,th{border-bottom:1px solid var(--line);padding:4px 6px;text-align:left}
.scroll{overflow-x:auto}
label{font-weight:600;font-size:14px;display:block;margin:10px 0 4px}
.x{float:right;min-width:44px;min-height:44px;border:0;background:none;font-size:22px}
@media(max-width:600px){.tools{grid-template-columns:minmax(0,1fr)}h2{font-size:24px}.aisle{grid-template-columns:40px minmax(0,1fr)}.al{font-size:34px}}
@media(prefers-reduced-motion:no-preference){.meter i{transition:width .3s}}
</style>
</head>

/* ---------- markdown model ---------- */
function fields(txt){const f={},lines=txt.split('\n');let i=0;while(i<lines.length&&!lines[i].trim())i++;

  return{f,rest:lines.slice(i).join('\n').trim()}}

  const parts=(nl<0?'':p.slice(nl+1)).split(/^(?=### )/m),head=fields(parts[0]);
  const subs=parts.slice(1).map(s=>{const n=s.indexOf('\n'),hd=s.slice(4,n<0?s.length:n).trim();return{hd,raw:s,salon:hd.startsWith('@')?hd.slice(1):null,...fields(n<0?'':s.slice(n+1))}});
  return{name:m?m[1]:h,id:m?m[2]:slug(h),headRaw:parts[0],f:head.f,notes:head.rest,subs}}
function parse(md){const fm=md.match(/^---\n[\s\S]*?\n---\n/),front=fm?fm[0]:'',o={front,pre:'',sections:[],producers:[],prodHead:'# Producers\n\n',glossary:{}};
  for(const t of md.slice(front.length).split(/^(?=# )/m)){
    if(!t.startsWith('# ')){o.pre+=t;continue}
    const title=t.slice(2,t.indexOf('\n')).trim();
    if(title==='Producers'){const ps=t.split(/^(?=## )/m);o.prodHead=ps[0];ps.slice(1).forEach(p=>o.producers.push(parseProd(p)));o.sections.push({prod:true})}

  if(!o.sections.some(s=>s.prod))o.sections.push({prod:true});
  return o}
const blank=()=>({stand:'',priority:'',reason:'',rating:0,bought:false,picked:false,note:'',here:false});
function stateFromMd(){const v={};for(const p of M.producers){const s=p.subs.find(x=>x.salon===SAL);if(s)v[p.id]={...blank(),stand:s.f.stand||'',priority:s.f.priority||'',reason:s.f.reason||'',rating:parseFloat(s.f.rating)||0,bought:s.f.bought==='yes',picked:s.f.picked_up==='yes',note:s.rest.split('\n').filter(l=>!l.startsWith('|')).join('\n').trim(),here:true}}return{v:1,updated:0,visits:v,added:{}}}
const has=x=>x&&(x.stand||x.priority||x.reason||x.rating||x.bought||x.note||x.here);
function visitMd(x){const L=['### @'+SAL];if(x.stand)L.push('- stand: '+x.stand);L.push('- status: '+(x.rating?'visited':'shortlist'));
  if(x.priority)L.push('- priority: '+x.priority);if(x.reason)L.push('- reason: '+x.reason.replace(/\n/g,' '));if(x.rating)L.push('- rating: '+x.rating);
  if(x.bought)L.push('- bought: yes');if(x.bought&&x.picked)L.push('- picked_up: yes');return L.join('\n')+'\n'+(x.note.trim()?'\n'+x.note.trim()+'\n':'')}
const end2=s=>s.replace(/\n*$/,'\n\n');
function toMd(){let out=M.front+M.pre;
  for(const sec of M.sections){if(!sec.prod){out+=end2(sec.raw);continue}
    out+=end2(M.prodHead);
    for(const p of prods()){if(p.isCat&&!has(S.visits[p.id]))continue;
      let b='## '+p.name+' {#'+p.id+'}\n'+(p.isNew?['region','appellations','tags'].filter(k=>p.f[k]).map(k=>'- '+k+': '+p.f[k]+'\n').join(''):p.headRaw);
      for(const s of p.subs)if(s.salon!==SAL)b=end2(b)+s.raw;
      const x=S.visits[p.id];if(has(x))b=end2(b)+visitMd({...x,stand:standOf(p,x)});out+=end2(b)}}
  return out.replace(/\n{3,}/g,'\n\n').replace(/\n+$/,'\n')}

/* ---------- state ---------- */

const tcase=s=>s.toLowerCase().replace(/(^|[\s\-'’(\/.])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase()).replace(/(^|\s)(De|Du|Des|La|Le|Les|Et|En|Sur|Au|Aux)(?=\s)/g,(m,a,w)=>a+w.toLowerCase()).replace(/(^|\s)(D|L)'/g,(m,a,w)=>a+w.toLowerCase()+"'").replace(/^./,c=>c.toUpperCase());

const CATID={};{const used=new Set();for(const c of CAT){let id=c.k;if(!id){const b='x-'+slug(c.n);id=b;let k=2;while(used.has(id))id=b+'-'+k++}used.add(id);c.id=id;c.tn=tcase(c.n);CATID[id]=c}}
const catOf=p=>CATID[p.id]||null;
const REGMAP={'loire':'Loire','bourgogne':'Bourgogne – Beaujolais','beaujolais':'Bourgogne – Beaujolais','rhone':'Rhône','bordeaux':'Bordeaux','languedoc':'Languedoc – Roussillon','sud-ouest':'Sud-Ouest – Armagnac','champagne':'Champagne','jura':'Jura','savoie':'Savoie – Bugey','alsace':'Alsace','provence':'Provence – Corse'};

const byId=id=>prods().find(p=>p.id===id);

  const cat=catOf(p);
  return{pv,tags,cat,absent:!cat&&pv.length>0,types:cat?cat.t:[],best:Math.max(0,...pv.map(s=>parseFloat(s.f.rating)||0)),bought:pv.some(s=>s.f.bought==='yes')||p.subs.some(s=>s.hd==='Purchases'),missed:pv.some(s=>s.f.status==='missed'),rev:(pv.at(-1)||{f:{}}).f.revisit||'',invites:tags.includes('invites us')}}
const hist=i=>i.pv.length?i.pv.map(s=>`${SHORT[s.salon]||s.salon} ${s.f.rating?s.f.rating+'★':(s.f.status==='missed'?'missed':'–')}`).join(' · '):'New to us';

  const pk=Object.values(S.visits).filter(x=>x.bought&&!x.picked).length;$('#pkc').textContent=pk||'';
  ({plan:renderPlan,route:renderRoute,pickup:renderPickup,data:renderData})[v]();
  $('#fab')?.remove();if(v==='route'||v==='plan')document.body.insertAdjacentHTML('beforeend','<button class="fab" id="fab" data-act="add">+ Add a stand</button>')}
const priSeg=(id,v)=>`<div class="seg">${['must','want','maybe'].map(n=>`<button data-act="pri" data-id="${id}" data-n="${n}" aria-pressed="${v.priority===n}">${n}</button>`).join('')}</div>`;

function renderPlan(){const all=prods(),sl=all.filter(p=>vget(p.id).priority),cnt=n=>sl.filter(p=>vget(p.id).priority===n).length;
  const regions=[...new Set(all.map(regionOf).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  const knownHere=M.producers.filter(p=>catOf(p)).length;
  V.innerHTML=`<h2>Who do we visit this time?</h2><p class="sub">${CAT.length} winemakers at this salon, ${knownHere} you already know · <b>${sl.length}</b> on the shortlist (${cnt('must')} must · ${cnt('want')} want · ${cnt('maybe')} maybe)</p>
  <div class="tools"><input type="search" id="q" placeholder="Search a name, region, appellation" value="${esc(F.q)}" aria-label="Search">
  <select id="reg" aria-label="Region"><option value="">All regions</option>${regions.map(r=>`<option ${F.region===r?'selected':''}>${esc(r)}</option>`).join('')}</select></div>
  <div class="chips">${[['all','All'],['short','Shortlist'],['known','Known'],['new','New to us'],['top','Rated 4+'],['missed','Missed before'],['bought','Bought before']].map(([k,l])=>`<button class="chip" data-act="filter" data-n="${k}" aria-pressed="${F.show===k}">${l}</button>`).join('')}</div>
  <div class="chips">${[['','Any type'],['sparkling','Sparkling'],['sweet','Sweet'],['spirits','Spirits'],['organic','Organic']].map(([k,l])=>`<button class="chip" data-act="type" data-n="${k}" aria-pressed="${F.type===k}">${l}</button>`).join('')}</div>
  <div id="list"></div>`;renderList()}
function renderList(){const q=norm(F.q.trim());
  let l=prods().map(p=>({p,i:info(p),v:vget(p.id)})).filter(({p,i,v})=>{
    if(q&&!norm(p.name+' '+regionOf(p)+' '+(p.f.appellations||'')+' '+(p.f.town||'')+' '+(i.cat?i.cat.s:'')).includes(q))return false;
    if(F.region&&regionOf(p)!==F.region)return false;
    if(F.type&&!i.types.includes(F.type))return false;
    return F.show==='all'||(F.show==='short'&&v.priority)||(F.show==='known'&&i.pv.length)||(F.show==='new'&&!i.pv.length)||(F.show==='top'&&i.best>=4)||(F.show==='missed'&&i.missed&&!i.best)||(F.show==='bought'&&i.bought)});
  const po={must:0,want:1,maybe:2,'':3};l.sort((a,b)=>po[a.v.priority]-po[b.v.priority]||(b.i.pv.length>0)-(a.i.pv.length>0)||b.i.best-a.i.best||a.p.name.localeCompare(b.p.name));
  const rest=l.length-F.limit;
  $('#list').innerHTML=(l.length?`<p class="sub">${l.length} winemaker${l.length>1?'s':''}</p>`:'')+(l.length?l.slice(0,F.limit).map(({p,i,v})=>`<div class="card ${v.priority?'sl':''}"><button class="nm" data-act="open" data-id="${p.id}">${esc(p.name)}</button>
    <div class="meta">${esc([p.f.region,p.f.appellations].filter(Boolean).join(' · '))}</div><div class="hist">${esc(hist(i))}</div>${badges(i)}
    ${priSeg(p.id,v)}${v.priority?`<div class="two"><input type="text" data-f="stand" data-id="${p.id}" value="${esc(v.stand)}" placeholder="${esc(i.cat?i.cat.s:'Stand')}" aria-label="Stand 2026"><input type="text" data-f="reason" data-id="${p.id}" value="${esc(v.reason)}" placeholder="Why (optional)" aria-label="Reason"></div>`:''}</div>`).join('')+(rest>0?`<div class="row"><button class="btn ghost" data-act="more">Show ${Math.min(40,rest)} more (${rest} left)</button></div>`:''):'<p class="empty">No winemaker matches these filters.</p>')}

function renderRoute(){const l=prods().map(p=>({p,i:info(p),v:vget(p.id)})).filter(x=>x.v.priority||x.v.here||x.v.rating||x.v.bought);
  const done=l.filter(x=>x.v.rating).length,mustLeft=l.filter(x=>x.v.priority==='must'&&!x.v.rating).length;
  if(!l.length){V.innerHTML=`<h2>Today's route</h2><p class="empty">Nothing on the shortlist yet. Pick winemakers in <a href="#plan">Plan</a>, or add a stand as you go.</p>`;return}
  const show=l.filter(x=>!(F.hide&&x.v.rating));const g={};
  for(const x of show){x.st=standOf(x.p,x.v);const k=standKey(x.st)[0];(g[k]=g[k]||[]).push(x)}
  const keys=Object.keys(g).sort((a,b)=>a==='~'?1:b==='~'?-1:a.localeCompare(b));
  V.innerHTML=`<h2>Today's route</h2><div class="prog"><span><b>${done}</b> of ${l.length} tasted · <b>${mustLeft}</b> must left</span><div class="meter"><i style="width:${Math.round(done/l.length*100)}%"></i></div>
  <button class="chip" data-act="hide" aria-pressed="${F.hide}">Hide tasted</button></div>
  ${keys.map(k=>`<section class="aisle"><div class="al" aria-label="Aisle ${k}">${k==='~'?'?':k}</div><div>${g[k].sort((a,b)=>standKey(a.st)[1]-standKey(b.st)[1]).map(({p,i,v,st})=>`
   <div class="card ${v.rating?'done':''}"><div class="rc"><div class="std">${esc(st||'—')}</div><div><button class="nm" data-act="open" data-id="${p.id}">${esc(p.name)}</button>
   <div class="meta">${v.priority?`<span class="tag ${v.priority==='must'?'must':''}">${v.priority}</span> `:''}${esc(hist(i))}</div>${i.invites?'<span class="tag">invites us · say hello</span>':''}${v.reason?`<div class="meta">${esc(v.reason)}</div>`:''}</div>
   <div class="stars" role="group" aria-label="Rating">${[1,2,3,4,5].map(n=>`<button data-act="star" data-id="${p.id}" data-n="${n}" class="${v.rating>=n?'f':''}" aria-label="${n} star${n>1?'s':''}">★</button>`).join('')}</div>
   <button class="buy" data-act="buy" data-id="${p.id}" aria-pressed="${v.bought}">${v.bought?'Bought here · pick up later':'Mark as bought'}</button></div></div>`).join('')}</div></section>`).join('')}
   ${keys.includes('~')?'<p class="sub">"?" = no stand number yet: tap the name to add it.</p>':''}`}

function renderPickup(){const l=prods().map(p=>({p,v:vget(p.id)})).filter(x=>x.v.bought).map(x=>({...x,st:standOf(x.p,x.v)})).sort((a,b)=>(a.v.picked-b.v.picked)||standKey(a.st)[0].localeCompare(standKey(b.st)[0])||standKey(a.st)[1]-standKey(b.st)[1]);
  const left=l.filter(x=>!x.v.picked).length;
  V.innerHTML=`<h2>${left?`${left} stand${left>1?'s':''} to pick up from`:'Nothing left to pick up'}</h2><p class="sub">Stands where you marked a purchase, in stand order.</p>
  ${l.length?l.map(({p,v,st})=>`<div class="card ${v.picked?'done':''}"><div class="rc"><div class="std">${esc(st||'—')}</div><div><button class="nm" data-act="open" data-id="${p.id}">${esc(p.name)}</button>${v.note?`<div class="meta">${esc(v.note)}</div>`:''}</div>
  <button class="buy" data-act="pick" data-id="${p.id}" aria-pressed="${v.picked}">${v.picked?'Picked up ✓':'Mark as picked up'}</button></div></div>`).join(''):'<p class="empty">Tap "Mark as bought" on a stand in Route and it shows up here.</p>'}`}

function renderData(){const g=Object.entries(M.glossary);
  V.innerHTML=`<h2>Your notes file</h2><p class="sub">Your notes are saved on this phone only, as you go. Nothing is sent anywhere. Save a copy of <code>vignerons.md</code> after the salon (and now and then): clearing this browser's data would erase the notes.</p>
  <div class="row"><button class="btn" data-act="export" id="dl">Save or share vignerons.md</button><button class="btn ghost" data-act="copy">Copy markdown</button></div>
  <textarea id="mdout" readonly hidden aria-label="Markdown"></textarea>
  <label for="imp">Load a notes file (past salons). Today's shortlist and ratings are kept.</label><input type="file" id="imp" accept=".md,.txt,text/markdown,text/plain">
  <p class="sub" id="impmsg"></p>
  ${g.length?`<h2 style="font-size:22px;margin-top:20px">Glossary</h2><table><tbody>${g.map(([k,v])=>`<tr><td><b>${esc(k)}</b></td><td>${esc(v)}</td></tr>`).join('')}</tbody></table>`:''}`}

/* ---------- sheets ---------- */
const sheet=$('#sheet'),panel=$('#panel');
function wines(rest){const rows=rest.split('\n').filter(l=>/^\|/.test(l)&&!/^\|\s*-/.test(l)).map(l=>l.replace(/^\||\|$/g,'').split('|').map(c=>c.trim()));
  if(rows.length<2)return'';return`<div class="scroll"><table><thead><tr>${rows[0].map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function openSheet(id){const p=byId(id);if(!p)return;const i=info(p),v=vget(id);
  panel.innerHTML=`<button class="x" data-act="close" aria-label="Close">×</button><h3>${esc(p.name)}</h3>
  <div class="meta">${esc([p.f.region,p.f.appellations,p.f.town].filter(Boolean).join(' · '))}</div>${badges(i)}
  ${i.cat?`<div class="meta">This salon: stand <b>${esc(i.cat.s)}</b>${i.cat.m?` · ${i.cat.m} medal${i.cat.m>1?'s':''}`:''}${i.cat.l?` · ${esc(i.cat.l)}`:''}</div>`:''}
  ${p.notes?`<p>${esc(p.notes)}</p>`:''}
  ${i.pv.map(s=>`<div class="visit"><b>${esc(SHORT[s.salon]||s.salon)}</b> · ${esc([s.f.stand&&'stand '+s.f.stand,s.f.rating?s.f.rating+'★':s.f.status,s.f.revisit&&'revisit: '+s.f.revisit,s.f.bought==='yes'&&'bought'].filter(Boolean).join(' · '))}
   ${s.f.label?`<div class="meta">${esc(s.f.label)}</div>`:''}${wines(s.rest)}${s.rest.split('\n').filter(l=>l.trim()&&!l.startsWith('|')).map(l=>`<div class="meta">${esc(l)}</div>`).join('')}</div>`).join('')}
  <div class="visit"><b>This salon</b>${priSeg(id,v)}
   <label for="s-stand">Stand</label><input type="text" id="s-stand" data-f="stand" data-id="${id}" value="${esc(v.stand)}" placeholder="${esc(i.cat?i.cat.s:'')}">
   <label for="s-reason">Why we want to go</label><input type="text" id="s-reason" data-f="reason" data-id="${id}" value="${esc(v.reason)}">
   <label for="s-note">Note</label><textarea id="s-note" data-f="note" data-id="${id}">${esc(v.note)}</textarea></div>`;
  sheet.hidden=false}
function openAdd(){panel.innerHTML=`<button class="x" data-act="close" aria-label="Close">×</button><h3>Add a stand</h3><p class="sub">A winemaker you stop at on impulse. Start typing: all 654 exhibitors are suggested, and their stand fills in by itself.</p>
  <form id="addf"><label for="a-name">Name</label><input type="text" id="a-name" list="names" required autocomplete="off"><datalist id="names">${prods().map(p=>`<option value="${esc(p.name)}">`).join('')}</datalist>
  <label for="a-stand">Stand</label><input type="text" id="a-stand" placeholder="e.g. B23">
  <label for="a-reg">Region (optional)</label><input type="text" id="a-reg">
  <div class="row"><button class="btn" type="submit">Add to today's route</button></div></form>`;sheet.hidden=false;setTimeout(()=>$('#a-name').focus(),50)}
function close(){sheet.hidden=true;render()}

/* ---------- events ---------- */
async function act(b){const{act:a,id,n}=b.dataset,v=id?vget(id):null;
  const p=id?byId(id):null,auto=p&&!v.stand&&catOf(p)?{stand:catOf(p).s}:{};
  if(a==='pri'){vset(id,{priority:v.priority===n?'':n,...auto});if(!sheet.hidden){openSheet(id);return}}
  else if(a==='star')vset(id,{rating:v.rating===+n?0:+n,here:true,...auto});
  else if(a==='buy')vset(id,{bought:!v.bought,picked:false,here:true,...auto});
  else if(a==='more'){F.limit+=40;renderList();return}
  else if(a==='type'){F.type=n;F.limit=40}
  else if(a==='pick')vset(id,{picked:!v.picked});
  else if(a==='open'){openSheet(id);return}
  else if(a==='add'){openAdd();return}
  else if(a==='close'){close();return}
  else if(a==='filter'){F.show=n;F.limit=40}
  else if(a==='hide')F.hide=!F.hide;
  else if(a==='export'){const md=toMd(),fn='vignerons.md';
    try{const file=new File([md],fn,{type:'text/markdown'});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:fn});$('#impmsg').textContent='Shared.';return}}catch(e){if(e&&e.name==='AbortError')return}
    try{const u=URL.createObjectURL(new Blob([md],{type:'text/markdown'})),l=document.createElement('a');l.href=u;l.download=fn;document.body.appendChild(l);l.click();setTimeout(()=>{URL.revokeObjectURL(u);l.remove()},1500);$('#impmsg').textContent='Saved as vignerons.md.'}catch(e){showMd(md,'Saving is not available here: copy the text below instead.')}return}
  else if(a==='copy'){const md=toMd();try{await navigator.clipboard.writeText(md);$('#impmsg').textContent='Copied to the clipboard.'}catch(e){showMd(md,'Select all the text below and copy it.')}return}
  render()}
function showMd(md,msg){const t=$('#mdout');t.hidden=false;t.value=md;t.style.minHeight='240px';t.select();$('#impmsg').textContent=msg}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b){act(b);return}if(e.target===sheet)close()});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&t.dataset.id){vset(t.dataset.id,{[t.dataset.f]:t.value});return}
  if(t.id==='q'){F.q=t.value;F.limit=40;renderList()}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='reg'){F.region=t.value;F.limit=40;renderList()}
  if(t.id==='imp'&&t.files[0]){const txt=await t.files[0].text();if(!/^# Producers/m.test(txt)){$('#impmsg').textContent='This file does not look like a vignerons.md notes file.';return}
    MD=txt;M=parse(MD);const now=Date.now();LS.set('vn.md',MD);LS.set('vn.mdUpdated',String(now));const fresh=stateFromMd();S={...fresh,visits:{...S.visits,...fresh.visits},added:{...S.added}};save();
    if(mdRef)try{await mdRef.set({md:MD,updated:now})}catch(err){}
    $('#impmsg').textContent=`Loaded ${M.producers.length} winemakers.`}});
document.addEventListener('submit',e=>{if(e.target.id!=='addf')return;e.preventDefault();
  const name=$('#a-name').value.trim(),stand=$('#a-stand').value.trim(),reg=$('#a-reg').value.trim();if(!name)return;
  let p=prods().find(x=>norm(x.name)===norm(name));
  if(!p){let id=slug(name),k=2;while(byId(id))id=slug(name)+'-'+k++;S.added[id]={name,region:reg};p={id}}
  vset(p.id,{here:true,stand:stand||vget(p.id).stand||catOf(p)?.s||''});sheet.hidden=true;location.hash='route';render()});
addEventListener('hashchange',()=>{sheet.hidden=true;render()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!sheet.hidden)close()});
render();
}
</script>
</body>
</html>
